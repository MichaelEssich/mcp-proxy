[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-proxy"
version = "1.0.0"
description = "MCP Proxy Server - Secure MCP HTTP endpoints with bearer token authentication"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "httpx2==2.10.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "pydantic-settings==2.14.2",
    "slowapi==0.1.10",
]

[project.scripts]
mcp-proxy = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
