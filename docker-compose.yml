services:
  mcp-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-proxy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Proxy configuration
      - PROXY_HOST=0.0.0.0
      - PROXY_PORT=8000
      
      # Target MCP server configuration
      - TARGET_MCP_URL=http://your-mcp-server-image:8080
      
      # Authentication configuration (required - no default token for security)
      - BEARER_TOKEN=${BEARER_TOKEN:?BEARER_TOKEN environment variable is required}
      - AUTH_HEADER_NAME=Authorization
      
      # Optional settings
      - DEBUG=${DEBUG:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - PROXY_PREFIX=${PROXY_PREFIX:-}
      # Trusted reverse proxy CIDRs (e.g. nginx Docker network "172.16.0.0/12")
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Real client IP header: "cf-connecting-ip" (Cloudflare, default) or "" for nginx (X-Forwarded-For)
      - REAL_IP_HEADER=${REAL_IP_HEADER:-cf-connecting-ip}
      - MAX_CONCURRENT_REQUESTS=${MAX_CONCURRENT_REQUESTS:-50}
    restart: unless-stopped

  # Example of how to run an MCP server alongside the proxy
  # mcp-server:
  #   image: your-mcp-server-image
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - MCP_SERVER_CONFIG=...
